name: Build add-ons

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_SUFFIX: beta

jobs:
  changes:
    name: Select add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.select.outputs.addons }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select add-ons to build
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          addons=()

          for config in */config.yaml; do
            addon=${config%%/*}

            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              addons+=("$addon")
            elif [[ "$EVENT_NAME" == "pull_request" ]] && \
                 ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- "$addon/"; then
              addons+=("$addon")
            elif [[ "$EVENT_NAME" == "push" ]] && \
                 ! git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- "$config"; then
              addons+=("$addon")
            fi
          done

          jq -cn --args '$ARGS.positional' "${addons[@]}" \
            | sed 's/^/addons=/' >> "$GITHUB_OUTPUT"

  version-check:
    name: Check version against changelog
    needs: changes
    if: needs.changes.outputs.addons != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
    steps:
      - uses: actions/checkout@v6

      # Beta iterates toward a release rather than past one, so config.yaml
      # carries a pre-release version such as 1.5.3-beta.4 and the changelog
      # carries the release it is heading for. Both checks run against that
      # base version, which is what production will publish unchanged.
      - name: config.yaml version matches the newest changelog entry
        run: |
          set -euo pipefail
          addon="${{ matrix.addon }}"
          cfg=$(yq -r '.version' "$addon/config.yaml")
          base=${cfg%%-*}
          if [ "$base" != "$cfg" ] && \
             ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$' <<< "$cfg"; then
            echo "::error::$cfg is not a release or a <version>-beta.<n> pre-release"
            exit 1
          fi
          mapfile -t vers < <(grep -oP '^### \K[0-9]+\.[0-9]+\.[0-9]+' "$addon/CHANGELOG.md")
          newest="${vers[0]}"
          if [ "$base" != "$newest" ]; then
            echo "::error::config.yaml is $cfg but the newest CHANGELOG entry is $newest"
            exit 1
          fi
          echo "version $cfg targets $newest, which the changelog documents"

      - name: A release with new features is a minor bump
        run: |
          set -euo pipefail
          addon="${{ matrix.addon }}"
          mapfile -t vers < <(grep -oP '^### \K[0-9]+\.[0-9]+\.[0-9]+' "$addon/CHANGELOG.md")
          newest="${vers[0]}"; prev="${vers[1]:-0.0.0}"
          # Body of the newest entry only, i.e. up to the next "### " heading.
          body=$(awk '/^### /{n++} n==1' "$addon/CHANGELOG.md")
          IFS=. read -r nmaj nmin _ <<< "$newest"
          IFS=. read -r pmaj pmin _ <<< "$prev"
          if grep -q '✨ New' <<< "$body"; then
            if [ "$nmaj" = "$pmaj" ] && [ "$nmin" = "$pmin" ]; then
              echo "::error::$newest declares new features but is only a patch bump over $prev"
              exit 1
            fi
            echo "$newest declares features and bumps the minor over $prev"
          else
            echo "$newest declares no new features; any bump is fine"
          fi

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: [changes, version-check]
    if: needs.changes.outputs.addons != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
        arch: [aarch64, amd64]

    steps:
      - uses: actions/checkout@v6

      - name: Read build settings
        id: settings
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: |
          build_from=$(yq -r '.args.BUILD_FROM' "$ADDON/build.yaml")
          build_from=${build_from//\{arch\}/$ARCH}
          version=$(yq -r '.version' "$ADDON/config.yaml")

          case "$ARCH" in
            aarch64) platform=linux/arm64 ;;
            amd64) platform=linux/amd64 ;;
          esac

          {
            echo "build_from=$build_from"
            echo "platform=$platform"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build add-on
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.addon }}
          file: ./${{ matrix.addon }}/Dockerfile
          platforms: ${{ steps.settings.outputs.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.arch }}-${{ matrix.addon }}-${{ env.IMAGE_SUFFIX }}:${{ steps.settings.outputs.version }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.arch }}-${{ matrix.addon }}-${{ env.IMAGE_SUFFIX }}:latest
          build-args: BUILD_FROM=${{ steps.settings.outputs.build_from }}
          secrets: |
            node_red_token=${{ secrets.NODE_RED_TOKEN }}
          provenance: false
